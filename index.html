<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Todo List App</title>
</head>

<body class="min-h-screen bg-gray-100 flex justify-center items-center p-4 overflow-x-hidden">

    <div class="w-full max-w-4xl bg-white rounded-2xl shadow-2xl p-8">

        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">
            My Todo List App
        </h1>

        <!-- Input and Add Button -->
        <div class="flex flex-col sm:flex-row gap-3 mb-4">
            <input
                id="taskInput"
                type="text"
                placeholder="Enter your task..."
                class="w-full sm:flex-1 min-w-0 px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
            />

            <button
                id="addBtn"
                type="button"
                class="cursor-pointer w-full sm:w-auto shrink-0 px-5 py-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 active:scale-95 transition duration-200"
            >
                Add Task
            </button>
        </div>

        <!-- Search Input -->
        <div class="mb-6">
            <input
                id="searchInput"
                type="text"
                placeholder="Search tasks..."
                class="w-full px-4 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 transition text-sm"
            />
        </div>

        <!-- Task List -->
        <ul id="taskList" class="space-y-3 w-full"></ul>

        <!-- Empty List Message -->
        <p id="emptyMessage" class="text-center text-gray-400 mt-6">
            No tasks yet. Add your first task!
        </p>

    </div>

    <script src="index.js"></script>

</body>

</html>
